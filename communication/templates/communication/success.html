<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 - CPAASChallenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center mb-0">送信完了</h2>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                        </div>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% else %}
                            <div class="alert alert-success" role="alert">
                                <h4 class="alert-heading">送信が完了しました！</h4>
                                <p>リクエストが正常に処理されました。</p>
                            </div>
                        {% endif %}
                        
                        <div class="mt-4">
                            <a href="/communication/sms/" class="btn btn-primary me-2">SMS送信</a>
                            <a href="/communication/voice/" class="btn btn-success me-2">音声通話</a>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/admin/" class="btn btn-outline-secondary">管理画面へ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
